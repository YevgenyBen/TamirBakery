name: CI

# Lint, types, functional tests, speed budget, end-to-end + accessibility tests and
# security rules tests (PLAN.md "Testing").
# Runs on every pull request, and is reused by deploy.yml before each deploy.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Functional tests (Vitest + axe)
        run: npm test

      - name: Build
        run: npm run build

      # Speed budget (PLAN.md "Speed budget"): Lighthouse on the production build,
      # with the thresholds in lighthouserc.json. Uses the runner's Chrome.
      - name: Speed budget (Lighthouse CI)
        run: npm run test:speed

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests (Playwright + axe)
        run: npx playwright test --trace off

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rules:
    name: Security rules (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      # The Firestore emulator needs Java 21 or newer.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - name: Cache emulator download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Firestore rules tests
        run: npm run test:rules
