<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מאפיית תמיר · תצוגה מקדימה v2</title>
<!-- Mockup v2, built from docs/DESIGN.md. Single file: open in a browser. Placeholder photos, sample prices and orders. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ===== Tokens (docs/DESIGN.md §10) ===== */
:root{
  --bg:#FBF6EE; --surface:#FFFFFF; --sunk:#F3EADC;
  --fg:#2E1F16; --muted:#6B5646; --line:#E3D3BE; --field:#9A8470;
  --primary:#92400E; --on-primary:#FFFFFF; --primary-soft:#F8E6D2;
  --berry:#A3264F; --berry-soft:#F9E3EA;
  --leaf:#476328; --leaf-soft:#E6EED8;
  --warn:#855400; --warn-soft:#FBEFD3;
  --bad:#A12A1C; --bad-soft:#FBE3DE;
  --ph-s:52%; --ph-l1:85%; --ph-l2:75%; --ph-ink:rgb(46 31 22/.18);
  --f-display:"Frank Ruhl Libre",Georgia,serif;
  --f-body:"Heebo","Assistant","Segoe UI",Arial,sans-serif;
  --t-xs:.875rem; --t-sm:.9375rem; --t-base:1rem; --t-lg:1.125rem; --t-h3:1.25rem;
  --t-h2:clamp(1.5rem,1.2rem + 1.2vw,1.875rem);
  --t-h1:clamp(1.875rem,1.4rem + 2vw,2.5rem);
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px; --s-8:64px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --shadow-1:0 1px 2px rgb(46 31 22/.06),0 4px 14px rgb(46 31 22/.06);
  --shadow-2:0 2px 4px rgb(46 31 22/.08),0 12px 32px rgb(46 31 22/.10);
  --dur-fast:150ms; --dur-base:200ms; --dur-slow:250ms;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1310; --surface:#241B16; --sunk:#2E241D;
  --fg:#F6ECE1; --muted:#CDB9A6; --line:#46382D; --field:#8C7765;
  --primary:#F2A65E; --on-primary:#2A1406; --primary-soft:#45291A;
  --berry:#F08DAD; --berry-soft:#4A2230;
  --leaf:#AFCF8A; --leaf-soft:#2C3A20;
  --warn:#F0C46A; --warn-soft:#3D2F12;
  --bad:#F59C8E; --bad-soft:#47201A;
  --ph-s:30%; --ph-l1:27%; --ph-l2:20%; --ph-ink:rgb(255 255 255/.14);
  --shadow-1:none; --shadow-2:0 2px 8px rgb(0 0 0/.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1310; --surface:#241B16; --sunk:#2E241D;
  --fg:#F6ECE1; --muted:#CDB9A6; --line:#46382D; --field:#8C7765;
  --primary:#F2A65E; --on-primary:#2A1406; --primary-soft:#45291A;
  --berry:#F08DAD; --berry-soft:#4A2230;
  --leaf:#AFCF8A; --leaf-soft:#2C3A20;
  --warn:#F0C46A; --warn-soft:#3D2F12;
  --bad:#F59C8E; --bad-soft:#47201A;
  --ph-s:30%; --ph-l1:27%; --ph-l2:20%; --ph-ink:rgb(255 255 255/.14);
  --shadow-1:none; --shadow-2:0 2px 8px rgb(0 0 0/.4);
  color-scheme:dark;
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--t-base)/1.6 var(--f-body)}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:var(--t-h1);line-height:1.15} h2{font-size:var(--t-h2);line-height:1.25} h3{font-size:var(--t-h3);font-weight:500;line-height:1.3}
p{margin:0}
small{font-size:var(--t-xs)}
a{color:var(--primary);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.i{font-size:1.25em;line-height:1;flex:none;vertical-align:-.2em}
[dir="rtl"] .flip{transform:scaleX(-1)}
.ltr{direction:ltr;unicode-bidi:isolate}
.tn{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.xs{font-size:var(--t-xs)} .sm{font-size:var(--t-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:44rem;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.wrap{padding-inline:24px}}
@media (min-width:900px){.wrap{max-width:64rem}}
@media (prefers-reduced-motion:no-preference){
  a,button,.card,.card .photo,.tile,.opt,.field input,.field select,.field textarea{transition:background-color var(--dur-fast) ease-out,color var(--dur-fast) ease-out,border-color var(--dur-fast) ease-out,box-shadow var(--dur-fast) ease-out,transform var(--dur-slow) ease-out}
}

/* ===== Preview bar (mockup only) ===== */
.pv{background:var(--sunk);border-bottom:1px solid var(--line);font-size:var(--t-xs);color:var(--muted)}
.pv .wrap{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;padding-block:6px}
.pv nav{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.pv a,.pv button{color:var(--fg);background:none;border:0;padding:6px 2px;min-height:32px;font-size:var(--t-xs);display:inline-flex;gap:4px;align-items:center;text-decoration:underline}
.skip{position:absolute;inset-inline-start:8px;top:-80px;z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm)}
.skip:focus{top:8px}

/* ===== Header ===== */
header.site{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-1)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);margin-inline-end:auto;min-height:44px}
.mark{width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:700 1.35rem/1 var(--f-display);flex:none}
.brand b{font:700 1.3rem/1.1 var(--f-display)}
.brand small{display:block;color:var(--muted);font-weight:400}
.hact{display:flex;gap:8px;align-items:center}
.pill-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:var(--r-pill);border:1px solid var(--field);background:var(--surface);color:var(--fg);font-size:var(--t-sm);font-weight:500;text-decoration:none}
.pill-btn:hover{background:var(--sunk)}
.pill-btn.cart{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.pill-btn.cart:hover{background:color-mix(in srgb,var(--primary) 90%,#000)}
.count{background:var(--on-primary);color:var(--primary);border-radius:var(--r-pill);min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:var(--t-xs);font-weight:700;padding-inline:6px}
nav.main{order:3;display:flex;gap:4px;align-items:center;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
nav.main a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:var(--r-pill);text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
nav.main a:hover{color:var(--fg);background:var(--sunk)}
nav.main a[aria-current="page"]{background:var(--primary-soft);color:var(--fg)}
nav.main a[aria-current="page"] .i{color:var(--primary)}
nav.main .a11y{margin-inline-start:auto;font-weight:400;font-size:var(--t-xs);text-decoration:underline;padding-inline:8px}
@media (min-width:900px){
  .hrow{flex-wrap:nowrap}
  nav.main{order:0;width:auto;flex:1;justify-content:center}
  .brand{margin-inline-end:0}
}
@media (max-width:479px){.brand b{font-size:1.15rem}.brand small{display:none}.mark{width:36px;height:36px}.hide-n{display:none}.pill-btn{padding-inline:12px}.hrow{gap:8px}}
.banner{background:var(--warn-soft);color:var(--warn);font-size:var(--t-sm);font-weight:500}
.banner .wrap{display:flex;gap:8px;align-items:center;padding-block:10px}

/* ===== Layout ===== */
main{padding-block:24px 56px;display:grid;gap:40px}
@media (min-width:760px){main{gap:56px;padding-block:32px 72px}}
main:focus{outline:none}
section{display:grid;gap:16px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.lede{color:var(--muted);font-size:var(--t-lg);max-width:62ch}
.eyebrow{color:var(--primary);font-weight:500;font-size:var(--t-sm);display:inline-flex;gap:6px;align-items:center}
.crumbs{font-size:var(--t-xs);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.two{display:grid;gap:24px}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr;align-items:start;gap:32px}}

/* ===== Photo placeholder ===== */
.photo{position:relative;overflow:hidden;border-radius:var(--r-lg);aspect-ratio:4/3;display:grid;place-items:center;color:var(--ph-ink);
  background:linear-gradient(135deg,hsl(var(--h,32) var(--ph-s) var(--ph-l1)),hsl(calc(var(--h,32) + 14) var(--ph-s) var(--ph-l2)))}
.photo>.i{font-size:clamp(2.5rem,12vw,4.5rem)}
.photo .cap{position:absolute;inset-inline-start:10px;bottom:10px;max-width:calc(100% - 20px);font-size:var(--t-xs);background:var(--surface);color:var(--muted);border-radius:var(--r-pill);padding:2px 10px}
.photo.hero{aspect-ratio:5/4}
.photo.sq{aspect-ratio:1}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:var(--r-pill);border:1px solid transparent;font-weight:500;text-decoration:none;background:none;color:var(--fg);line-height:1.2;text-align:center}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:color-mix(in srgb,var(--primary) 90%,#000)}
.btn.sec{background:var(--surface);border-color:var(--field)}
.btn.sec:hover{background:var(--sunk)}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:8px 16px;font-size:var(--t-sm)}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:0;color:var(--primary);text-decoration:underline;text-underline-offset:3px;font-weight:500;display:inline-flex;gap:6px;align-items:center;min-height:24px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ===== Chips & pills ===== */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-pill);padding:2px 10px;font-size:var(--t-xs);font-weight:500;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip .i{font-size:1.1em}
.chip.ok{background:var(--leaf-soft);color:var(--leaf)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.new{background:var(--berry-soft);color:var(--berry)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:-2px;scrollbar-width:none}
.filters button{flex:none;min-height:44px;padding:8px 16px;border-radius:var(--r-pill);border:1px solid var(--field);background:var(--surface);font-weight:500;white-space:nowrap}
.filters button:hover{background:var(--sunk)}
.filters button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* ===== Hero ===== */
.hero{display:grid;gap:24px}
.hero .copy{display:grid;gap:16px;align-content:center}
@media (min-width:760px){.hero{grid-template-columns:1.05fr 1fr;align-items:center;gap:40px}}
.facts{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:var(--t-sm);color:var(--muted)}
.facts span{display:inline-flex;gap:6px;align-items:center}
.facts .i{color:var(--primary)}

/* ===== Steps ===== */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr))}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:16px;display:grid;gap:8px;align-content:start}
.steps .n{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700}
.steps b{font-weight:500}
.steps p{color:var(--muted);font-size:var(--t-sm)}

/* ===== Product cards ===== */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden;display:flex;flex-direction:column}
.card .photo{border-radius:0}
.card .body{padding:14px 16px 6px;display:grid;gap:8px;flex:1;align-content:start}
.card h3{font-size:var(--t-lg)}
.card h3 a{color:inherit;text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;z-index:1}
.card:hover h3{color:var(--primary)}
@media (prefers-reduced-motion:no-preference){.card:hover .photo{transform:scale(1.03)}}
.card .desc{color:var(--muted);font-size:var(--t-sm)}
.card .foot{padding:8px 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card .foot .btn,.card .foot .link{position:relative;z-index:2}
.card .badge{position:absolute;top:10px;inset-inline-start:10px;z-index:2}
.card.out .photo{filter:saturate(.6)}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-weight:400;color:var(--muted)}

/* ===== Gallery, about, reviews ===== */
.gallery{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.gallery .photo{border-radius:var(--r-md)}
.gallery .photo:first-child{grid-column:span 2;grid-row:span 2}
@media (min-width:760px){.gallery{grid-template-columns:repeat(4,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:20px;display:grid;gap:12px}
.panel.soft{background:var(--sunk);box-shadow:none;border-color:transparent}
.note{border:1.5px dashed var(--field);border-radius:var(--r-lg);padding:14px 16px;color:var(--muted);font-size:var(--t-sm);display:flex;gap:10px;align-items:flex-start}
.note .i{color:var(--primary);margin-top:2px}
.faqs{display:grid;gap:8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
summary{cursor:pointer;padding:12px 16px;font-weight:500;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none}
summary::-webkit-details-marker{display:none}
summary .i{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){summary .i{transition:transform var(--dur-base) ease-out}}
details[open] summary .i{transform:rotate(180deg)}
details p{padding:0 16px 14px;color:var(--muted)}
.list-icons{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list-icons li{display:flex;gap:10px;align-items:flex-start}
.list-icons .i{color:var(--primary);margin-top:3px}

/* ===== Product page ===== */
.pgal{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.pgal .photo:first-child{grid-column:span 2}
.pinfo{display:grid;gap:20px}
.bigprice{font:700 1.75rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr))}
.tile{border:1px solid var(--field);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;min-height:44px;text-align:start;display:grid;gap:2px}
.tile:hover{background:var(--sunk)}
.tile small{color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--primary-soft)}
.tile b{font-weight:500}

/* ===== Forms ===== */
.form{display:grid;gap:20px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;padding:0;margin-bottom:8px}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-weight:500;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.req{font-size:var(--t-xs);color:var(--muted);font-weight:400}
.help{font-size:var(--t-sm);color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--field);border-radius:var(--r-md);background:var(--surface);font-size:1rem}
.field textarea{min-height:88px;resize:vertical}
.field input:hover,.field textarea:hover,.field select:hover{border-color:var(--fg)}
.field [aria-invalid="true"]{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.err{color:var(--bad);font-size:var(--t-sm);font-weight:500;display:flex;gap:6px;align-items:center}
.opts{display:grid;gap:8px}
@media (min-width:520px){.opts.cols{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--field);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;min-height:44px}
.opt:hover{background:var(--sunk)}
.opt:has(input:checked){border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--primary-soft)}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--primary);flex:none}
.opt span{display:grid;gap:2px}
.opt small{color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--primary);flex:none}
.privacy{font-size:var(--t-sm);color:var(--muted);background:var(--sunk);border-radius:var(--r-md);padding:12px 14px}
.errsum{border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:6px}
.errsum b{display:flex;gap:6px;align-items:center}
.errsum ul{margin:0;padding-inline-start:20px}
.errsum a{color:var(--bad)}

/* ===== Cart ===== */
.lines{display:grid}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.line .photo{border-radius:var(--r-md);aspect-ratio:1}
.line .photo>.i{font-size:1.6rem}
.line .what{min-width:0;display:grid;gap:4px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:44px;border-radius:50%;border:1px solid var(--field);background:var(--surface);display:grid;place-items:center}
.qty button:hover{background:var(--sunk)}
.qty output{min-width:2ch;text-align:center;font-weight:700}
.sum{display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.sum .total{font-weight:700;font-size:var(--t-lg);border-top:1px solid var(--line);padding-top:10px}
@media (min-width:900px){.checkout{grid-template-columns:1.3fr 1fr}.checkout aside{position:sticky;top:120px}}

/* ===== Confirmation ===== */
.refbox{display:grid;gap:14px}
.ref{font:700 1.9rem/1 var(--f-body);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--sunk);border-radius:var(--r-md);flex-wrap:wrap}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:32px 1fr;gap:12px;padding-bottom:16px;position:relative}
.timeline li::before{content:"";position:absolute;inset-inline-start:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.timeline .done .dot{background:var(--leaf-soft);color:var(--leaf)}
.timeline .now .dot{background:var(--primary);color:var(--on-primary)}

/* ===== Footer ===== */
footer.site{background:var(--surface);border-top:1px solid var(--line);color:var(--muted);font-size:var(--t-sm)}
footer .wrap{padding-block:32px;display:grid;gap:24px}
@media (min-width:760px){footer .wrap{grid-template-columns:1.4fr 1fr 1fr}}
footer h2{font-size:var(--t-lg);color:var(--fg);margin-bottom:8px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
footer a{color:var(--fg);display:inline-flex;gap:6px;align-items:center;min-height:32px}
footer .legal{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px;font-size:var(--t-xs)}

/* ===== Toast ===== */
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:50;pointer-events:none;padding-inline:16px}
.toast div{background:var(--fg);color:var(--bg);border-radius:var(--r-pill);padding:10px 18px;font-size:var(--t-sm);box-shadow:var(--shadow-2);display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){.toast div{animation:up var(--dur-base) ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}

/* ===== Admin ===== */
.achrome{background:var(--fg);color:var(--bg)}
.achrome .brand{color:var(--bg)}
.achrome .mark{background:var(--bg);color:var(--fg)}
.achrome .pill-btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 45%,transparent)}
.achrome .pill-btn:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}
.anav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.anav a{display:inline-flex;gap:6px;align-items:center;min-height:40px;padding:8px 14px;border-radius:var(--r-pill);color:color-mix(in srgb,var(--bg) 78%,transparent);text-decoration:none;font-weight:500;white-space:nowrap}
.anav a[aria-current="page"]{background:var(--bg);color:var(--fg)}
.stats{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:2px}
.stat b{font:700 1.5rem/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.rows{display:grid;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:10px;min-width:0}
.row .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.row .who{display:grid;gap:2px;min-width:0}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--t-sm);color:var(--muted)}
.row .meta span{display:inline-flex;gap:4px;align-items:center}
.row .detail{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:12px}
.row .acts{display:flex;flex-wrap:wrap;gap:8px}
.row .acts .btn{min-height:36px;padding:6px 14px;font-size:var(--t-sm)}
.prow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center}
.prow .photo{border-radius:var(--r-sm);aspect-ratio:1}
.prow .photo>.i{font-size:1.4rem}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--t-sm);min-height:36px}
.switch input{appearance:none;width:44px;height:26px;border-radius:var(--r-pill);background:var(--field);position:relative;margin:0;flex:none;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--surface)}
.switch input:checked{background:var(--leaf)}
.switch input:checked::after{inset-inline-start:21px}
@media (prefers-reduced-motion:no-preference){.switch input::after{transition:inset-inline-start var(--dur-fast) ease-out}}
.datechips{display:flex;flex-wrap:wrap;gap:6px}
.datechips span{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:var(--r-pill);padding-block:2px;padding-inline:12px 4px;font-size:var(--t-sm)}
.datechips button{width:32px;height:32px;border:0;border-radius:50%;background:var(--surface);display:grid;place-items:center}

/* ===== Style guide ===== */
.swatches{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr))}
.sw{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface);font-size:var(--t-xs)}
.sw i{display:block;height:56px;font-style:normal}
.sw div{padding:8px 10px;display:grid}
.sw code{font-size:var(--t-xs)}
.typescale{display:grid;gap:10px}
.typescale div{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.typescale code{color:var(--muted);font-size:var(--t-xs);min-width:7rem}
.demo{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
</style>

  const list=S.orders.filter(o=>S.ofilter==="all"||o.st===S.ofilter);
  const n=k=>S.orders.filter(o=>o.st===k).length;
  return `<h1 id="h1">${L("הזמנות","Orders")}</h1>
  <div class="stats"><div class="stat"><span class="sm muted">${L("חדשות","New")}</span><b>${n("new")}</b></div><div class="stat"><span class="sm muted">${L("ממתינות לתשלום","Awaiting payment")}</span><b>${n("conf")}</b></div><div class="stat"><span class="sm muted">${L("לאיסוף השבוע","Due this week")}</span><b>3</b></div></div>
  <div class="filters" role="group" aria-label="${L("סינון","Filter")}">${fl.map(([k,t])=>`<button type="button" data-ofilter="${k}" aria-pressed="${S.ofilter===k}">${t}</button>`).join("")}</div>
  <div class="rows">${list.map(o=>{const s=ST[o.st],open=S.open===o.ref;return `<article class="row" aria-labelledby="o-${o.ref}">
   <div class="top"><div class="who"><b id="o-${o.ref}"><bdi>${o.ref}</bdi> · ${L(o.name,o.en)}</b><span class="sm">${esc(T(o.item))}</span></div>
    <div class="chips"><span class="chip ${s[0]}">${I(s[1])}${s[2]}</span></div></div>
   <div class="meta"><span>${I("calendar-blank")}${day(o.date)}</span><span>${I(o.f==="pickup"?"storefront":"truck")}${o.f==="pickup"?L("איסוף","Pickup"):L("משלוח","Delivery")}</span><span class="tn">${I("wallet")}${money(o.total)}</span></div>
   <button class="link" type="button" data-open="${o.ref}" aria-expanded="${open}">${open?L("הסתרת פרטים","Hide details"):L("פרטים ופעולות","Details and actions")}${I(open?"caret-up":"caret-down")}</button>
   ${open?`<div class="detail"><p class="sm muted">${L("טלפון: ","Phone: ")}<bdi class="tn">050-000-0000</bdi> · ${L("כיתוב: \"מזל טוב נועה\"","Message: \"Happy birthday Noa\"")}</p>
    <div class="acts">${o.st==="new"?`<button class="btn pri" type="button" data-st="${o.ref}" data-to="conf">${I("check")}${L("אישור הזמנה","Confirm order")}</button>`:""}
     ${o.st==="conf"?`<button class="btn pri" type="button" data-st="${o.ref}" data-to="ready">${I("currency-circle-dollar")}${L("סימון כשולם","Mark as paid")}</button>`:""}
     <a class="btn sec" href="#" data-wa>${I("whatsapp-logo")}${L("וואטסאפ ללקוח","WhatsApp customer")}</a>
     ${o.st!=="cancelled"?`<button class="btn danger" type="button" data-st="${o.ref}" data-to="cancelled">${I("x")}${L("ביטול","Cancel")}</button>`:""}</div></div>`:""}
  </article>`}).join("")||`<p class="note">${I("info")}<span>${L("אין הזמנות בסינון הזה.","No orders in this filter.")}</span></p>`}</div>`}
function adminProducts(){
  return `<div class="sec-head"><h1 id="h1">${L("מוצרים","Products")}</h1><button class="btn pri sm" type="button" data-soon>${I("plus")}${L("מוצר חדש","New product")}</button></div>
  <div class="rows">${P.map(p=>`<div class="row prow">${ph(p.h,p.icon,T(p.name))}<div class="who" style="display:grid;gap:2px;min-width:0"><b>${esc(T(p.name))}</b><span class="sm muted tn">${p.sizes?L("החל מ־","from "):""}${money(p.price)} · ${p.mode==="request"?L("בקשה","Request"):L("סל","Cart")}</span></div>
   <label class="switch"><input type="checkbox" role="switch" data-avail="${p.id}" ${p.on?"checked":""}><span>${p.on?L("זמין","On sale"):L("אזל","Sold out")}</span></label></div>`).join("")}</div>`}
function adminSettings(){
  return `<h1 id="h1">${L("הגדרות","Settings")}</h1>
  <div class="two"><div class="panel form">
   <label class="switch"><input type="checkbox" role="switch" data-open-store ${S.storeOpen?"checked":""}><span><b>${S.storeOpen?L("החנות פתוחה להזמנות","Shop is taking orders"):L("החנות סגורה להזמנות","Shop is closed to orders")}</b></span></label>
   <div class="field"><label for="cut">${L("שעת סגירה להזמנות לשישי","Friday order cutoff")}</label><input id="cut" type="time" value="12:00"></div>
   <div class="field"><label for="fee">${L("דמי משלוח (₪)","Delivery fee (₪)")}</label><input id="fee" type="number" inputmode="numeric" value="25"></div>
   <div class="field"><label for="ban">${L("טקסט ההודעה בראש האתר","Banner text")}</label><textarea id="ban">${L("הזמנות לשישי נסגרות ביום חמישי ב־12:00.","Friday orders close Thursday at 12:00.")}</textarea></div></div>
   <div class="panel"><h2 style="font-size:var(--t-h3)">${L("ימים סגורים","Closed dates")}</h2>
    <div class="datechips">${S.closed.map(d=>`<span>${day(d)}<button type="button" data-rmdate="${d}" aria-label="${L("הסרת","Remove")} ${day(d)}">${I("x")}</button></span>`).join("")||`<span class="muted">${L("אין","None")}</span>`}</div>
    <div class="field"><label for="nd">${L("הוספת יום סגור","Add a closed date")}</label><input id="nd" type="date"></div><button class="btn sec sm" type="button" data-adddate style="justify-self:start">${I("plus")}${L("הוספה","Add")}</button></div></div>
  <div class="ctas"><button class="btn pri" type="button" data-saved>${I("floppy-disk")}${L("שמירה","Save")}</button></div>`}

/* ---------- style guide ---------- */
function style(){
  const tok=["bg","surface","sunk","fg","muted","line","field","primary","on-primary","primary-soft","berry","berry-soft","leaf","leaf-soft","warn","warn-soft","bad","bad-soft"];
  const cs=getComputedStyle(document.documentElement);
  return `<section aria-labelledby="h1"><h1 id="h1">${L("מדריך עיצוב","Style guide")}</h1><p class="lede">${L("כל מה שבעמוד הזה מגיע מ־DESIGN.md. החליפו ערכת צבע בסרגל העליון כדי לראות את הגרסה הכהה.","Everything here comes from DESIGN.md. Switch the theme in the top bar to see dark mode.")}</p></section>
  <section aria-labelledby="c"><h2 id="c">${L("צבעים","Colour")}</h2><div class="swatches">${tok.map(t=>`<div class="sw"><i style="background:var(--${t})"></i><div><code>--${t}</code><span class="muted ltr">${cs.getPropertyValue("--"+t).trim()}</span></div></div>`).join("")}</div></section>
  <section aria-labelledby="t"><h2 id="t">${L("טיפוגרפיה","Type")}</h2><div class="typescale">
   ${[["h1","--t-h1",`<h1 style="font-size:var(--t-h1)">${L("עוגות ומאפים ביתיים","Home-baked cakes")}</h1>`],["h2","--t-h2",`<h2>${L("הכי מבוקשים","Most loved")}</h2>`],["h3","--t-h3",`<h3>${L("עוגת שוקולד עשירה","Rich chocolate cake")}</h3>`],["lg","--t-lg",`<p style="font-size:var(--t-lg)">${L("מזמינים יומיים מראש","Order two days ahead")}</p>`],["base","1rem",`<p>${L("טקסט רץ ב־Heebo, 16 פיקסלים","Body text in Heebo, 16px")}</p>`],["xs","--t-xs",`<p class="xs">${L("הכי קטן שמותר: 14 פיקסלים","Smallest allowed: 14px")}</p>`]].map(r=>`<div><code>${r[1]}</code>${r[2]}</div>`).join("")}</div></section>
  <section aria-labelledby="b"><h2 id="b">${L("כפתורים","Buttons")}</h2><div class="demo"><button class="btn pri" type="button">${L("ראשי","Primary")}</button><button class="btn sec" type="button">${I("whatsapp-logo")}${L("משני","Secondary")}</button><button class="btn danger" type="button">${L("מחיקה","Delete")}</button><button class="btn pri" type="button" disabled>${L("לא זמין","Disabled")}</button><button class="link" type="button">${L("קישור","Link")}${arrowNext()}</button></div></section>
  <section aria-labelledby="ch"><h2 id="ch">${L("תגיות סטטוס","Status chips")}</h2><div class="chips"><span class="chip">${I("clock")}${L("3 ימים מראש","3 days ahead")}</span><span class="chip ok">${I("check-circle")}${L("שולם","Paid")}</span><span class="chip warn">${I("hourglass-medium")}${L("ממתינה","Waiting")}</span><span class="chip new">${I("sparkle")}${L("חדש","New")}</span><span class="chip bad">${I("x-circle")}${L("אזל","Sold out")}</span></div></section>
  <section aria-labelledby="f"><h2 id="f">${L("שדות","Fields")}</h2><div class="two">
   <div class="field"><label for="d1">${L("שם מלא","Full name")} <span class="req">${L("חובה","required")}</span></label><input id="d1" value="${L("נועה","Noa")}"><small class="help">${L("טקסט עזרה מתחת לשדה","Helper text under the field")}</small></div>
   <div class="field"><label for="d2">${L("טלפון נייד","Mobile phone")} <span class="req">${L("חובה","required")}</span></label><input id="d2" aria-invalid="true" aria-describedby="d2e" dir="ltr" value="050"><p class="err" id="d2e">${I("warning-circle")}${L("נא לכתוב מספר נייד מלא","Please enter a full mobile number")}</p></div></div></section>
  <section aria-labelledby="cd"><h2 id="cd">${L("כרטיס מוצר","Product card")}</h2><div class="grid">${["challah","cheese"].map(id=>card(byId(id))).join("")}</div></section>`}

/* ---------- render ---------- */
function render(focus){
  const rt=route(), isAdmin=rt.r.startsWith("admin");
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="he"?"rtl":"ltr";
  document.getElementById("skip").textContent=L("דילוג לתוכן","Skip to content");
  document.getElementById("pv").innerHTML=pv();
  document.getElementById("chrome").innerHTML=isAdmin?adminChrome(rt.r):header(rt.r);
  const v=document.getElementById("view");
  v.innerHTML={home,store,cart,order,about,style,admin,"admin-products":adminProducts,"admin-settings":adminSettings,accessibility:()=>textPage("accessibility"),policies:()=>textPage("policies"),product:()=>product(rt.id)}[rt.r]?.()??notFound();
  document.getElementById("footer").hidden=isAdmin;
  if(!isAdmin)document.getElementById("footer").innerHTML=footer();
  const h=v.querySelector("h1");document.title=(h&&rt.r!=="home"?h.textContent+" · ":"")+L("מאפיית תמיר","Tamir Bakery");
  if(focus)v.focus({preventScroll:true});
}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button,a");if(!b)return;const d=b.dataset;
  if(b.id==="langBtn"){S.lang=S.lang==="he"?"en":"he";render();document.getElementById("langBtn").focus();return}
  if(b.id==="themeBtn"){const r=document.documentElement,c=r.dataset.theme||"auto",n={auto:"light",light:"dark",dark:"auto"}[c];if(n==="auto")delete r.dataset.theme;else r.dataset.theme=n;render();document.getElementById("themeBtn").focus();return}
  if("skip" in d){ev.preventDefault();document.getElementById("view").focus();return}
  if("wa" in d){ev.preventDefault();toast(L("באתר עצמו ייפתח וואטסאפ עם הודעה מוכנה","On the live site this opens WhatsApp with a ready message"),"whatsapp-logo");return}
  if("soon" in d){ev.preventDefault();toast(L("לא פעיל בתצוגה המקדימה","Not active in this preview"),"info");return}
  if(d.add){S.cart[d.add]=(S.cart[d.add]||0)+1;render();toast(L("נוסף לסל","Added to cart"));return}
  if(d.filter){S.filter=d.filter;render();document.querySelector(`[data-filter="${d.filter}"]`).focus();return}
  if(d.size!==undefined){S.size[route().id]=+d.size;render();document.querySelector(`[data-size="${d.size}"]`).focus();return}
  if(d.q){S.cart[d.q]=Math.max(0,(S.cart[d.q]||0)+ +d.d);render();const nb=document.querySelector(`[data-q="${d.q}"][data-d="${d.d}"]`);(nb||document.getElementById("view")).focus();return}
  if(d.focus){ev.preventDefault();document.getElementById(d.focus)?.focus();return}
  if("copy" in d){navigator.clipboard?.writeText("0500000000").catch(()=>{});toast(L("המספר הועתק","Number copied"),"copy");return}
  if(d.ofilter){S.ofilter=d.ofilter;render();document.querySelector(`[data-ofilter="${d.ofilter}"]`).focus();return}
  if(d.open){S.open=S.open===d.open?null:d.open;render();document.querySelector(`[data-open="${d.open}"]`).focus();return}
  if(d.st){const o=S.orders.find(x=>x.ref===d.st);if(d.to==="cancelled"&&!confirm(L(`לבטל את הזמנה ${o.ref}?`,`Cancel order ${o.ref}?`)))return;o.st=d.to;render();toast(L("הסטטוס עודכן","Status updated"));document.querySelector(`[data-open="${o.ref}"]`)?.focus();return}
  if(d.rmdate){S.closed=S.closed.filter(x=>x!==d.rmdate);render();toast(L("היום הוסר","Date removed"));return}
  if("adddate" in d){const v=document.getElementById("nd").value;if(v&&!S.closed.includes(v)){S.closed.push(v);S.closed.sort();render();toast(L("היום נוסף","Date added"))}return}
  if("saved" in d){toast(L("נשמר","Saved"));return}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.name==="fulfil"||t.name==="pay"){S.form[t.name]=t.value;if(t.name==="fulfil"){render();document.querySelector(`input[name=fulfil][value=${t.value}]`).focus()}}
  if(t.dataset.avail){byId(t.dataset.avail).on=t.checked;render();document.querySelector(`[data-avail="${t.dataset.avail}"]`).focus();toast(t.checked?L("המוצר זמין","Item on sale"):L("סומן כאזל","Marked sold out"))}
  if("openStore" in t.dataset){S.storeOpen=t.checked;render();document.querySelector("[data-open-store]").focus()}
  if(t.id==="mkt")S.form.mkt=t.checked;
});
document.addEventListener("input",ev=>{const t=ev.target;if(["name","phone","addr","date","notes"].includes(t.id))S.form[t.id]=t.value});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  if(ev.target.id==="pform"){location.hash="order";return}
  const f=S.form,e={};
  if(!f.name?.trim())e.name=L("נא לכתוב שם מלא","Please enter your full name");
  if(!/^0?5\d[-\s]?\d{3}[-\s]?\d{4}$/.test((f.phone||"").trim()))e.phone=L("נא לכתוב מספר נייד מלא, למשל 050-1234567","Please enter a full mobile number, like 050-1234567");
  if(f.fulfil==="delivery"&&!f.addr?.trim())e.addr=L("נא לכתוב כתובת למשלוח","Please enter a delivery address");
  if(!f.date)e.date=L("נא לבחור תאריך","Please choose a date");
  S.errs=e;
  if(Object.keys(e).length){render();document.getElementById("errsum").focus();return}
  location.hash="order";
});
window.addEventListener("hashchange",()=>{if(route().r!=="cart")S.errs={};render(true);window.scrollTo(0,0)});
render();
</script>
</body>
</html>
