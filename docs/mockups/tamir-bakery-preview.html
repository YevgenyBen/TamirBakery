<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מאפיית תמיר · תצוגה מקדימה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap">
<style>
/* Tokens and component styles follow docs/DESIGN.md. Layout: one phone column (max 44rem, 64rem on desktop); preview bar, header, status banner, page view, footer. Admin swaps in its own chrome. RTL by default via logical properties. */
:root{
  --bg:#FBF6EE; --surface:#FFFFFF; --sunk:#F3EADC;
  --fg:#2E1F16; --muted:#6B5646; --line:#E3D3BE; --field:#9A8470;
  --primary:#92400E; --on-primary:#FFFFFF; --primary-soft:#F8E6D2;
  --berry:#A3264F; --berry-soft:#F9E3EA;
  --leaf:#476328; --leaf-soft:#E6EED8;
  --warn:#855400; --warn-soft:#FBEFD3;
  --bad:#A12A1C; --bad-soft:#FBE3DE;
  --ph-s:55%; --ph-l1:84%; --ph-l2:74%; --ph-dot:rgba(255,255,255,.5);
  --shadow-1:0 1px 2px rgb(46 31 22/.06),0 4px 14px rgb(46 31 22/.06);
  --shadow-2:0 2px 4px rgb(46 31 22/.08),0 12px 32px rgb(46 31 22/.10);
  --f-display:"Frank Ruhl Libre",Georgia,serif;
  --f-body:"Heebo","Assistant","Segoe UI",Arial,sans-serif;
  --t-xs:.875rem; --t-sm:.9375rem; --t-lg:1.125rem; --t-h3:1.25rem;
  --t-h2:clamp(1.5rem,1.2rem + 1.2vw,1.875rem); --t-h1:clamp(1.875rem,1.4rem + 2vw,2.5rem);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r:16px;
  --dur-fast:150ms; --dur-slow:250ms;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1310; --surface:#241B16; --sunk:#2E241D;
  --fg:#F6ECE1; --muted:#CDB9A6; --line:#46382D; --field:#8C7765;
  --primary:#F2A65E; --on-primary:#2A1406; --primary-soft:#45291A;
  --berry:#F08DAD; --berry-soft:#4A2230;
  --leaf:#AFCF8A; --leaf-soft:#2C3A20;
  --warn:#F0C46A; --warn-soft:#3D2F12;
  --bad:#F59C8E; --bad-soft:#47201A;
  --ph-s:32%; --ph-l1:28%; --ph-l2:21%; --ph-dot:rgba(255,255,255,.1);
  --shadow-1:none; --shadow-2:0 2px 8px rgb(0 0 0/.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1310; --surface:#241B16; --sunk:#2E241D;
  --fg:#F6ECE1; --muted:#CDB9A6; --line:#46382D; --field:#8C7765;
  --primary:#F2A65E; --on-primary:#2A1406; --primary-soft:#45291A;
  --berry:#F08DAD; --berry-soft:#4A2230;
  --leaf:#AFCF8A; --leaf-soft:#2C3A20;
  --warn:#F0C46A; --warn-soft:#3D2F12;
  --bad:#F59C8E; --bad-soft:#47201A;
  --ph-s:32%; --ph-l1:28%; --ph-l2:21%; --ph-dot:rgba(255,255,255,.1);
  --shadow-1:none; --shadow-2:0 2px 8px rgb(0 0 0/.4);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:var(--t-h1)} h2{font-size:var(--t-h2)} h3{font-size:var(--t-h3);font-weight:500}
p{margin:0}
small{font-size:var(--t-xs)}
a{color:var(--primary);text-underline-offset:3px}
@media (prefers-reduced-motion:no-preference){a,.btn,.card,.card .ph,.filters button,.sizes button,.opt,nav.main a{transition:background-color var(--dur-fast) ease-out,color var(--dur-fast) ease-out,border-color var(--dur-fast) ease-out,transform var(--dur-slow) ease-out}}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.wrap{max-width:44rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{max-width:64rem}}

.skip{position:absolute;inset-inline-start:8px;top:-60px;z-index:50;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;text-decoration:none}
.skip:focus{top:8px}
.pv{background:var(--primary-soft);color:var(--fg);font-size:var(--t-xs);text-align:center;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-1)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand .mark{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-family:var(--f-display);font-size:1.2rem;flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.hact{display:flex;gap:8px;align-items:center}
.lang{border:1px solid var(--field);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:var(--t-sm);min-height:44px}
.bag{border:0;background:var(--primary);color:var(--on-primary);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;min-height:44px;font-size:var(--t-sm);text-decoration:none;display:inline-flex;align-items:center}
nav.main{display:flex;gap:4px;padding-block:0 8px;overflow-x:auto;align-items:center}
nav.main a{text-decoration:none;color:var(--muted);padding:10px 14px;border-radius:999px;white-space:nowrap;font-weight:500}
nav.main a[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
nav.main .a11y{margin-inline-start:auto;font-size:var(--t-xs);font-weight:400;text-decoration:underline;text-underline-offset:3px}
.banner{background:var(--warn-soft);color:var(--warn);font-size:var(--t-sm);font-weight:500}
.banner .wrap{padding-block:8px}
.banner.closed{background:var(--bad-soft);color:var(--bad)}

main{padding-block:20px 48px;display:grid;gap:40px}
main:focus{outline:none}
section{display:grid;gap:14px;min-width:0}
.lede{color:var(--muted);max-width:62ch;font-size:var(--t-lg)}
.crumbs{font-size:var(--t-xs);color:var(--muted)}
.crumbs a{color:var(--muted)}

/* placeholder photos */
.ph{position:relative;border-radius:var(--r);aspect-ratio:4/3;max-width:100%;overflow:hidden;
  background:
   radial-gradient(circle at 20% 30%,var(--ph-dot) 0 3px,transparent 4px) 0 0/34px 34px,
   radial-gradient(circle at 70% 70%,var(--ph-dot) 0 2px,transparent 3px) 0 0/26px 26px,
   linear-gradient(135deg,hsl(var(--h,30) var(--ph-s) var(--ph-l1)),hsl(calc(var(--h,30) + 18) var(--ph-s) var(--ph-l2)));
  display:flex;align-items:flex-end;padding:10px}
.ph span{font-size:var(--t-xs);background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 10px;opacity:.92}

.hero{display:grid;gap:18px}
@media (min-width:760px){.hero{grid-template-columns:1.1fr 1fr;align-items:center}}
.hero .ph{aspect-ratio:5/4}
.ctas{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid transparent;font-weight:500;text-decoration:none;cursor:pointer;background:none}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:color-mix(in srgb,var(--primary) 90%,#000)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface);border-color:var(--field);color:var(--fg)}
.btn.sec:hover{background:var(--sunk)}
.btn.sm{min-height:44px;padding:6px 16px;font-size:var(--t-sm)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr))}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);padding:14px;display:grid;gap:6px;align-content:start}
.steps .n{width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:.9rem}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);overflow:hidden;display:flex;flex-direction:column;color:inherit;text-decoration:none}
.card .ph{border-radius:0;aspect-ratio:16/9}
.card .body{padding:12px 14px 14px;display:grid;gap:6px;flex:1;align-content:start}
.card:hover h3{color:var(--primary)}
@media (prefers-reduced-motion:no-preference){.card:hover .ph{transform:scale(1.03)}}
.card h3{font-size:var(--t-lg)}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:var(--t-xs)}
.chip{border-radius:999px;padding:2px 10px;background:var(--sunk);color:var(--muted);font-weight:500}
.chip.ok{background:var(--leaf-soft);color:var(--leaf)}
.chip.no{background:var(--bad-soft);color:var(--bad)}
.allergen{font-size:var(--t-xs);color:var(--muted)}
.card .foot{padding:0 14px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.gallery{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.gallery .ph{aspect-ratio:1;border-radius:var(--r-md)}
.gallery .ph:first-child{grid-column:span 2;grid-row:span 2}

.split{display:grid;gap:18px}
@media (min-width:760px){.split{grid-template-columns:1fr 1.3fr;align-items:start}}

.info{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);padding:16px;display:grid;gap:12px}
dl.kv{margin:0;display:grid;gap:10px}
dl.kv dt{font-weight:700}
dl.kv dd{margin:0;color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate}
.ref.ltr{display:inline-block}
.tn{font-variant-numeric:tabular-nums}

details.faq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
details.faq summary{cursor:pointer;padding:12px 14px;font-weight:500;list-style-position:inside}
details.faq p{padding:0 14px 14px;color:var(--muted)}
.faqs{display:grid;gap:8px}

.strip{display:flex;flex-wrap:wrap;gap:8px;font-size:var(--t-sm)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-block:2px}
.filters button{border:1px solid var(--field);background:var(--surface);border-radius:999px;padding:6px 16px;cursor:pointer;white-space:nowrap;min-height:44px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.note{border:1.5px dashed var(--field);border-radius:var(--r);padding:12px 14px;font-size:var(--t-sm);color:var(--muted);background:var(--sunk)}
.note b{color:var(--fg)}
.empty{text-align:center;padding:28px 16px;display:grid;gap:12px;justify-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* product page */
.pgal{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.pgal .ph:first-child{grid-column:span 2;aspect-ratio:4/3}
.pgal .ph{aspect-ratio:4/3}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes button{border:1.5px solid var(--field);background:var(--surface);border-radius:var(--r-md);padding:8px 12px;cursor:pointer;text-align:start;min-height:44px;display:grid}
.sizes button small{color:var(--muted)}
.sizes button[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--primary-soft)}
.bigprice{font-family:var(--f-display);font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums}

/* forms */
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;margin-bottom:6px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--field);border-radius:var(--r-md);padding:10px 12px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--primary)}
.opt small{display:block;color:var(--muted)}
.opt.dis{opacity:.55;cursor:not-allowed}
.field{display:grid;gap:4px;min-width:0}
.field label{font-weight:500}
.field small{color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--field);background:var(--surface);border-radius:var(--r-md);padding:9px 12px;min-height:44px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field input[aria-invalid="true"]{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.err{color:var(--bad);font-size:var(--t-sm);font-weight:500}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--primary);flex:none}
.form{display:grid;gap:18px;max-width:36rem}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.line .what{min-width:0}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:44px;height:44px;border-radius:50%;border:1px solid var(--field);background:var(--surface);cursor:pointer}
.total{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.total.big{font-weight:700;font-size:1.15rem}
.lnote{font-size:var(--t-xs);color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:2px 8px;display:inline-block;margin-top:4px}

/* confirmation */
.refbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);padding:16px;display:grid;gap:12px}
.ref{font-size:1.8rem;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--sunk);border-radius:var(--r-md)}
.copyrow b{font-variant-numeric:tabular-nums}
.payinfo{display:grid;gap:8px}

footer.site{border-top:1px solid var(--line);background:var(--surface);font-size:var(--t-sm);color:var(--muted)}
footer .wrap{padding-block:22px 30px;display:grid;gap:14px}
footer .links{display:flex;flex-wrap:wrap;gap:6px 16px}
footer .links a,footer .links button{color:var(--fg);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
footer .biz{display:grid;gap:2px}

/* policies */
.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc a{border:1px solid var(--field);background:var(--surface);border-radius:999px;padding:8px 14px;text-decoration:none;color:var(--fg);font-size:var(--t-sm)}
.policy{scroll-margin-top:110px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.policy ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;color:var(--muted)}

/* admin */
.achrome{background:var(--fg);color:var(--bg)}
.achrome .hrow{flex-wrap:wrap}
.achrome .brand{color:var(--bg)}
.achrome .lang,.achrome .out{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:var(--t-xs);text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.anav{display:flex;gap:4px;overflow-x:auto;padding-block:0 8px}
.anav a{color:color-mix(in srgb,var(--bg) 70%,transparent);text-decoration:none;padding:6px 12px;border-radius:999px;white-space:nowrap;font-weight:500}
.anav a[aria-current="page"]{background:var(--bg);color:var(--fg)}
.signin{max-width:24rem;margin:40px auto;display:grid;gap:14px;text-align:center;justify-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 20px}
.rows{display:grid;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;min-width:0}
.row .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.row .top button.open{all:unset;cursor:pointer;display:grid;gap:2px;flex:1;min-width:0}
.row .top button.open:focus-visible{outline:3px solid var(--primary);border-radius:6px}
.ctrls{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
.ctrls .field input,.ctrls .field select{min-height:40px;padding:6px 10px;border-radius:var(--r-sm)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:var(--t-xs);font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.new{background:var(--berry-soft);color:var(--berry)}
.pill.conf,.pill.unpaid{background:var(--warn-soft);color:var(--warn)}
.pill.ready,.pill.paid,.pill.done{background:var(--leaf-soft);color:var(--leaf)}
.pill.declined,.pill.cancelled{background:var(--bad-soft);color:var(--bad)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--primary)}
.detail{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:12px}
.paidrec{background:var(--leaf-soft);color:var(--leaf);border-radius:var(--r-md);padding:8px 12px;font-size:var(--t-sm)}
.agal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr))}
.agal .item{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.agal .item .ph{border-radius:0;aspect-ratio:4/3}
.agal .item .in{padding:8px;display:grid;gap:6px}
.agal .item .in input{border:1px solid var(--field);background:var(--surface);border-radius:var(--r-sm);padding:6px 8px;min-height:36px;width:100%;font-size:var(--t-xs)}
.agal .item .mv{display:flex;gap:4px}
.agal .item .mv button{flex:1;border:1px solid var(--field);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;min-height:36px}
.dates{display:flex;flex-wrap:wrap;gap:6px}
.dates span{display:inline-flex;gap:6px;align-items:center;background:var(--sunk);border-radius:999px;padding:2px 4px 2px 10px}
html[dir="rtl"] .dates span{padding:2px 10px 2px 4px}
.dates button{border:0;background:var(--surface);border-radius:50%;width:28px;height:28px;cursor:pointer;line-height:1}
.muted{color:var(--muted)} .small{font-size:var(--t-xs)}
.h3row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:30;pointer-events:none;padding-inline:16px}
.toast div{background:var(--fg);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:var(--t-sm);box-shadow:var(--shadow-2)}
@media (prefers-reduced-motion:no-preference){.toast div{animation:up .2s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.4}}}
</style>
</head>
<body>
<a class="skip" href="#" data-skip>דלג לתוכן</a>
<div class="pv" id="pv"></div>
<header class="site" id="siteHeader">
  <div class="wrap">
    <div class="hrow">
      <a class="brand" href="#"><span class="mark" aria-hidden="true">ת</span><b id="brandName"></b></a>
      <div class="hact">
        <button class="lang" id="langBtn" type="button"></button>
        <a class="bag" id="bagBtn" href="#cart"></a>
      </div>
    </div>
    <nav class="main" id="nav"></nav>
  </div>
</header>
<div class="banner" id="banner" hidden><div class="wrap" id="bannerText"></div></div>
<div id="adminChrome" hidden></div>
<main class="wrap" id="view" tabindex="-1"></main>
<footer class="site" id="siteFooter"><div class="wrap" id="footer"></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"><div id="toastText" hidden></div></div>

<script>
let lang="he";
try{const l=localStorage.getItem("tamir-lang"); if(l==="en"||l==="he") lang=l;}catch(e){}
const L=(he,en)=>lang==="he"?he:en;
const B=o=>o[lang];

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h) return {r:"home"};
  if(["store","cart","about","accessibility"].includes(h)) return {r:h};
  if(h==="policies"||h.startsWith("policies-")) return {r:"policies",sec:h.slice(9)};
  if(h.startsWith("p-")) return prod(h.slice(2))?{r:"product",id:h.slice(2)}:{r:"404"};
  if(h.startsWith("order-")){const o=ORDERS.find(o=>o.ref===h.slice(6)); return o?{r:"order",o}:{r:"404"};}
  if(h==="admin"||h.startsWith("admin-")) return {r:"admin",tab:["orders","products","gallery","settings"].includes(h.slice(6))?h.slice(6):"orders"};
  return {r:"404"};
}

function viewCart(){
  if(!cart.length) return `<section><h1>${L("ההזמנה שלי","My order")}</h1><div class="empty"><b>${L("עוד לא הוספתם מוצרים","You haven't added anything yet")}</b><a class="btn pri" href="#store">${L("לחנות","Browse the store")}</a></div></section>`;
  const live=cart.filter(l=>prod(l.id).on), items=live.map(l=>prod(l.id));
  const canPickup=items.every(p=>fulfilOf(p).pickup), canDel=items.every(p=>fulfilOf(p).delivery);
  if(form.f==="delivery"&&!canDel&&canPickup) form.f="pickup";
  if(form.f==="pickup"&&!canPickup&&canDel) form.f="delivery";
  const lead=Math.max(S.leadDays,...items.map(p=>p.lead)), minD=earliest(lead);
  const sub=live.reduce((s,l)=>s+lineTotal(l),0), fee=form.f==="delivery"?S.deliveryFee:0;
  const hasReq=items.some(p=>p.mode==="request");
  const req=`<small>${L("(חובה)","(required)")}</small>`, opt=`<small>${L("(לא חובה)","(optional)")}</small>`;
  const fe=k=>errs[k]?`<span class="err" id="e-${k}">${errs[k]}</span>`:"";
  const inv=k=>errs[k]?`aria-invalid="true" aria-describedby="e-${k}"`:"";
  return `<section><h1>${L("ההזמנה שלי","My order")}</h1>
  <form class="form" id="orderForm" novalidate>
    <div>${cart.map((l,i)=>{const p=prod(l.id);return `<div class="line"><div class="what"><b>${esc(B(p.name))}</b>${sizeLabel(p,l.size)?` · <span class="muted">${esc(sizeLabel(p,l.size))}</span>`:""}
        ${l.text?`<div class="small muted">${L("כיתוב","Inscription")}: <bdi>${esc(l.text)}</bdi></div>`:""}
        <div class="small muted tn">${money(p.sizes[l.size].price)}</div>
        ${p.on?"":`<span class="lnote">${L("המוצר אזל מאז שהוספתם אותו. הוא לא ייכלל בהזמנה.","This item sold out since you added it. It won't be included.")}</span>`}</div>
      <span class="qty"><button type="button" data-q="${i}:-1" aria-label="${L("פחות","Fewer")}">−</button><span class="tn">${l.qty}</span><button type="button" data-q="${i}:1" aria-label="${L("עוד","More")}">+</button></span></div>`;}).join("")}</div>

    <fieldset><legend>${L("איך מקבלים?","How do you want it?")}</legend>
      <label class="opt ${canPickup?"":"dis"}"><input type="radio" name="f" value="pickup" ${form.f==="pickup"?"checked":""} ${canPickup?"":"disabled"}><span>${L("איסוף מהמטבח","Pickup from the kitchen")}<small>${canPickup?L(`ללא עלות · ${B(S.pickupHours)}`,`Free · ${B(S.pickupHours)}`):L("חלק מהמוצרים במשלוח בלבד","Some items are delivery only")}</small></span></label>
      <label class="opt ${canDel?"":"dis"}"><input type="radio" name="f" value="delivery" ${form.f==="delivery"?"checked":""} ${canDel?"":"disabled"}><span>${L("משלוח עד הבית","Home delivery")}<small>${canDel?`${money(S.deliveryFee)} · ${B(S.deliveryArea)}`:L("חלק מהמוצרים באיסוף בלבד","Some items are pickup only")}</small></span></label>
    </fieldset>

    <div class="field"><label for="c-date">${L("תאריך","Date")} ${req}</label><input id="c-date" type="date" min="${minD}" value="${form.date}" ${inv("date")}>
      <small>${L(`המועד הקרוב: ${fmtDate(minD)}. סגור בשבת, בחגים ובתאריכים: `,`Earliest: ${fmtDate(minD)}. Closed on Shabbat, holidays and: `)}${S.closedDates.map(fmtDate).join(", ")||"—"}</small>${fe("date")}</div>
    <div class="field"><label for="c-name">${L("שם","Name")} ${req}</label><input id="c-name" dir="auto" autocomplete="name" value="${esc(form.name)}" ${inv("name")}>${fe("name")}</div>
    <div class="field"><label for="c-phone">${L("טלפון","Phone")} ${req}</label><input id="c-phone" type="tel" dir="ltr" autocomplete="tel" inputmode="tel" value="${esc(form.phone)}" ${inv("phone")}><small>${L("כדי לאשר את ההזמנה בוואטסאפ","So we can confirm your order on WhatsApp")}</small>${fe("phone")}</div>
    <div class="field"><label for="c-email">${L("אימייל","Email")} ${opt}</label><input id="c-email" type="email" dir="ltr" autocomplete="email" value="${esc(form.email)}"><small>${L("לקבלת אישור הזמנה במייל","For an emailed order confirmation")}</small></div>
    ${form.f==="delivery"?`<div class="field"><label for="c-addr">${L("כתובת למשלוח","Delivery address")} ${req}</label><input id="c-addr" dir="auto" autocomplete="street-address" value="${esc(form.addr)}" ${inv("addr")}>${fe("addr")}</div>`:""}
    <div class="field"><label for="c-notes">${L("הערות","Notes")} ${opt}</label><textarea id="c-notes" dir="auto">${esc(form.notes)}</textarea></div>

    <fieldset><legend>${L("תשלום","Payment")}</legend>
      ${S.cashOn?`<label class="opt"><input type="radio" name="pay" value="cash" ${form.pay==="cash"?"checked":""}><span>${L("מזומן","Cash")}<small>${L("באיסוף או במסירה","On pickup or delivery")}</small></span></label>`:""}
      ${S.bitOn?`<label class="opt"><input type="radio" name="pay" value="bit" ${form.pay==="bit"?"checked":""}><span>Bit / PayBox<small>${L("אחרי שנאשר את ההזמנה נשלח בקשת תשלום על הסכום המדויק","After we confirm your order we send a payment request for the exact amount")}</small></span></label>`:""}
    </fieldset>

    <div style="display:grid;gap:4px">
      <div class="total small muted"><span>${L("מוצרים","Items")}</span><span>${money(sub)}</span></div>
      ${fee?`<div class="total small muted"><span>${L("משלוח","Delivery")}</span><span>${money(fee)}</span></div>`:""}
      <div class="total big"><span>${L("סה״כ","Total")}</span><span>${money(sub+fee)}</span></div>
      ${hasReq?`<p class="small muted">${L("בעוגה מעוצבת המחיר הסופי יאושר בוואטסאפ.","For a custom cake, the final price is confirmed on WhatsApp.")}</p>`:""}
    </div>
    <label class="check"><input type="checkbox" id="c-terms" ${form.terms?"checked":""} ${inv("terms")}><span>${L(`קראתי ואני מסכים/ה ל<a href="#policies-terms">תקנון ההזמנות</a> ול<a href="#policies-cancellation">מדיניות הביטול</a>`,`I have read and agree to the <a href="#policies-terms">order terms</a> and <a href="#policies-cancellation">cancellation policy</a>`)}</span></label>${fe("terms")}
    ${S.storeOpen?`<button class="btn pri" type="submit">${L("שליחת הזמנה","Send order")}</button>`
      :`<p class="err">${L("החנות סגורה כרגע להזמנות. אפשר לשמור את הסל ולשלוח כשנחזור, או לכתוב לנו בוואטסאפ.","The store isn't taking orders right now. Keep your cart and send it when we reopen, or message us on WhatsApp.")}</p><div class="ctas"><button class="btn pri" type="submit" disabled>${L("שליחת הזמנה","Send order")}</button><button class="btn sec" type="button" data-wa>${L("וואטסאפ","WhatsApp")}</button></div>`}
  </form></section>`;
}

const ST={new:{he:"חדשה",en:"New"},conf:{he:"אושרה",en:"Confirmed"},ready:{he:"מוכנה",en:"Ready"},done:{he:"הושלמה",en:"Completed"},declined:{he:"נדחתה",en:"Declined"},cancelled:{he:"בוטלה",en:"Cancelled"}};

function adminChrome(tab){

function viewAdmin(tab){
  if(!adminIn) return `<div class="signin"><span class="brand"><span class="mark" aria-hidden="true">ת</span></span><h1>${L("כניסה לניהול","Admin sign-in")}</h1><p class="muted">${L("רק חשבונות שברשימת המנהלים יכולים להיכנס.","Only accounts on the admin list can sign in.")}</p><button class="btn pri" type="button" data-signin>${L("כניסה עם Google","Sign in with Google")}</button></div>`;

function adminOrders(){
  const fl=[["all",L("הכול","All")],["new",B(ST.new)],["conf",B(ST.conf)],["ready",B(ST.ready)],["unpaid",L("לא שולמו","Unpaid")],["done",B(ST.done)]];
  const list=ORDERS.filter(o=>orderFilter==="all"||(orderFilter==="unpaid"?!o.paid&&!["declined","cancelled"].includes(o.st):o.st===orderFilter)).sort((a,b)=>a.date.localeCompare(b.date));
  return `<section><div class="h3row"><h1>${L("הזמנות","Orders")}</h1><span class="small muted">${L("לפי תאריך איסוף / משלוח","By pickup / delivery date")}</span></div>
    <div class="filters" role="group">${fl.map(([k,l])=>`<button type="button" data-of="${k}" aria-pressed="${k===orderFilter}">${l}</button>`).join("")}</div>
    <div class="rows">${list.length?list.map(orderRow).join(""):`<div class="empty">${L("אין הזמנות בסינון הזה","No orders match this filter")}</div>`}</div></section>`;
}
function orderRow(o){
  const sub=o.items.reduce((s,l)=>s+lineTotal(l),0)+(o.f==="delivery"?S.deliveryFee:0);
  const items=o.items.map(l=>`${l.qty}× ${esc(B(prod(l.id).name))}`).join(", ");
  const open=openOrder===o.ref;
  const next={new:[["conf",L("אישור","Confirm")],["declined",L("דחייה","Decline")]],conf:[["ready",L("מוכנה","Mark ready")],["cancelled",L("ביטול","Cancel")]],ready:[["done",L("נמסרה","Mark completed")]]}[o.st]||[];
  return `<div class="row"><div class="top">
      <button class="open" type="button" data-oo="${o.ref}" aria-expanded="${open}"><span><b class="tn ltr">${o.ref}</b> · <bdi>${esc(o.name)}</bdi></span><span class="small muted">${items}</span></button>
      <div class="pills"><span class="pill ${o.st}">${B(ST[o.st])}</span>${["declined","cancelled"].includes(o.st)?"":`<span class="pill ${o.paid?"paid":"unpaid"}">${o.paid?L("שולמה","Paid"):L("לא שולמה","Unpaid")}</span>`}</div></div>
    <div class="meta"><span class="chip">${fmtDate(o.date)}</span><span class="chip">${o.f==="pickup"?L("איסוף","Pickup"):L("משלוח","Delivery")}</span><span class="chip">${B(PM[o.pay])}</span><span class="chip tn">${money(sub)}</span></div>
    ${open?`<div class="detail">
      <dl class="kv">
        <div><dt>${L("פריטים","Items")}</dt><dd>${o.items.map(l=>{const p=prod(l.id);return `${l.qty}× ${esc(B(p.name))}${sizeLabel(p,l.size)?` (${esc(sizeLabel(p,l.size))})`:""}${l.text?` · ${L("כיתוב","inscription")}: <bdi>${esc(l.text)}</bdi>`:""}`;}).join("<br>")}</dd></div>
        <div><dt>${L("לקוח/ה","Customer")}</dt><dd><bdi>${esc(o.name)}</bdi> · <span class="ltr tn">${esc(o.phone)}</span>${o.email?` · <span class="ltr">${esc(o.email)}</span>`:""}</dd></div>
        ${o.f==="delivery"?`<div><dt>${L("כתובת","Address")}</dt><dd><bdi>${esc(o.addr)}</bdi></dd></div>`:""}
        ${o.cnote?`<div><dt>${L("הערות הלקוח/ה","Customer notes")}</dt><dd><bdi>${esc(o.cnote)}</bdi></dd></div>`:""}
      </dl>
      <div class="ctas">${next.map(([s,l])=>`<button class="btn sec sm" type="button" data-ost="${o.ref}:${s}">${l}</button>`).join("")}<button class="btn sec sm" type="button" data-wa>${L("וואטסאפ ללקוח/ה","WhatsApp customer")}</button></div>
      ${["declined","cancelled"].includes(o.st)?"":o.paid?`<div class="paidrec">${L("שולמה","Paid")} · ${B(PM[o.paid.method])} · <span class="tn">${money(o.paid.amount)}</span> · ${fmtDate(o.paid.date)} · ${L("סומן ע״י","marked by")} ${esc(o.paid.by)} <button class="linkbtn" type="button" data-unpay="${o.ref}">${L("ביטול סימון","Undo")}</button></div>`
        :`<fieldset><legend>${L("סימון כשולמה","Mark as paid")}</legend><div class="ctrls">
          <div class="field"><label for="pm-${o.ref}">${L("אמצעי","Method")}</label><select id="pm-${o.ref}">${Object.keys(PM).map(k=>`<option value="${k}" ${k===o.pay?"selected":""}>${B(PM[k])}</option>`).join("")}</select></div>
          <div class="field"><label for="pa-${o.ref}">${L("סכום (₪)","Amount (₪)")}</label><input id="pa-${o.ref}" type="number" min="0" value="${sub}"></div></div>
          <button class="btn pri sm" type="button" data-pay="${o.ref}" style="justify-self:start">${L("סימון כשולמה","Mark as paid")}</button></fieldset>`}
      <div class="field"><label for="in-${o.ref}">${L("הערה פנימית","Internal note")}</label><input id="in-${o.ref}" dir="auto" value="${esc(o.inote)}" data-inote="${o.ref}"></div>
    </div>`:""}
  </div>`;
}

function renderChrome(){
  const rt=route(), isAdmin=rt.r==="admin";
  document.documentElement.lang=lang; document.documentElement.dir=lang==="he"?"rtl":"ltr";
  document.getElementById("pv").textContent=L("תצוגה מקדימה של האתר · התמונות, הטקסטים והמחירים לדוגמה","Website preview · photos, text and prices are examples");
  document.querySelector(".skip").textContent=L("דלג לתוכן","Skip to content");
  document.getElementById("siteHeader").hidden=isAdmin; document.getElementById("siteFooter").hidden=isAdmin;
  const ac=document.getElementById("adminChrome"); ac.hidden=!isAdmin; ac.innerHTML=isAdmin?adminChrome(rt.tab):"";
  document.getElementById("brandName").textContent=B(S.bizName);
  const lb=document.getElementById("langBtn"); lb.textContent=L("English","עברית"); lb.lang=lang==="he"?"en":"he";
  const n=cartCount(); const bb=document.getElementById("bagBtn"); bb.textContent=n?L(`סל (${n})`,`Cart (${n})`):L("סל","Cart");
  bb.setAttribute("aria-label",L(`סל הקניות, ${n} פריטים`,`Cart, ${n} items`));
  const cur={home:"",store:"store",product:"store",about:"about"}[rt.r];
  document.getElementById("nav").innerHTML=[["",L("בית","Home")],["store",L("חנות","Store")],["about",L("אודות","About")]]
    .map(([h,l])=>`<a href="#${h}" ${cur===h?'aria-current="page"':""}>${l}</a>`).join("")+`<a class="a11y" href="#accessibility">${L("נגישות","Accessibility")}</a>`;
  document.getElementById("nav").setAttribute("aria-label",L("ראשי","Main"));
  const bn=document.getElementById("banner");
  bn.hidden=isAdmin||!(!S.storeOpen||S.bannerOn&&B(S.banner));
  bn.className="banner"+(S.storeOpen?"":" closed");
  document.getElementById("bannerText").textContent=S.storeOpen?B(S.banner):B(S.closedMsg)+fmtDate(S.reopen);
  document.getElementById("footer").innerHTML=`<div class="biz"><b style="color:var(--fg)">${esc(B(S.bizName))}</b>
      <span>${L("עוסק מס׳","Business no.")} <span class="tn">${esc(S.bizNum)}</span> ${L("(לדוגמה)","(example)")} · ${esc(B(S.pickupArea))}</span>
      <span><span class="ltr tn">${esc(S.bizPhone)}</span> · <span class="ltr">${esc(S.bizEmail)}</span></span>
      <span>${esc(B(S.pickupHours))} · ${L("סגור בשבת ובחגים","Closed on Shabbat and holidays")}</span></div>
    <div class="links"><a href="#policies-terms">${L("תקנון ומדיניות","Terms and policies")}</a><a href="#policies-cancellation">${L("ביטול עסקה","Cancel an order")}</a><a href="#policies-privacy">${L("פרטיות","Privacy")}</a><a href="#accessibility">${L("הצהרת נגישות","Accessibility statement")}</a></div>
    <div class="links"><button type="button" data-wa>WhatsApp</button><button type="button" data-later>Instagram</button><button type="button" data-lang lang="${lang==="he"?"en":"he"}">${L("English","עברית")}</button><a href="#admin">${L("ניהול","Admin")}</a></div>
    <span>© ${today.getFullYear()} ${esc(B(S.bizName))}</span>`;
}
function render(){
  renderChrome();
  const rt=route(), v=document.getElementById("view");
  v.innerHTML= rt.r==="store"?viewStore(): rt.r==="product"?viewProduct(rt.id): rt.r==="cart"?viewCart(): rt.r==="order"?viewOrder(rt.o)
    : rt.r==="about"?viewAbout(): rt.r==="policies"?viewPolicies(): rt.r==="accessibility"?viewAccess(): rt.r==="admin"?viewAdmin(rt.tab): rt.r==="404"?view404(): viewHome();
  const titles={home:"",store:L("חנות","Store"),cart:L("סל","Cart"),about:L("אודות","About"),policies:L("תקנון ומדיניות","Terms and policies"),accessibility:L("הצהרת נגישות","Accessibility"),admin:L("ניהול","Admin"),order:L("אישור הזמנה","Order confirmation"),"404":L("לא נמצא","Not found"),product:rt.id?B(prod(rt.id).name):""};
  document.title=(titles[rt.r]?titles[rt.r]+" · ":"")+B(S.bizName);
}

let toastTimer;
function toast(msg){const el=document.getElementById("toastText"); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2400);}
function readForm(){
  const v=id=>{const e=document.getElementById(id); return e?e.value:undefined;};
  ["date","name","phone","email","addr","notes"].forEach(k=>{const x=v("c-"+k); if(x!==undefined) form[k]=x;});
  const t=document.getElementById("c-terms"); if(t) form.terms=t.checked;
}
function copy(text){
  const done=()=>toast(L(`הועתק: ${text}`,`Copied: ${text}`));
  try{navigator.clipboard.writeText(text).then(done,()=>toast(text));}catch(e){toast(text);}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("button,a"); if(!el) return;
  const d=el.dataset;
  if(d.skip!==undefined){e.preventDefault(); document.getElementById("view").focus(); return;}
  if(el.id==="langBtn"||d.lang!==undefined){readForm(); lang=lang==="he"?"en":"he"; try{localStorage.setItem("tamir-lang",lang)}catch(_){} render(); return;}
  if(d.wa!==undefined){waToast(); return;}
  if(d.later!==undefined){toast(L("יתווסף בהמשך","Coming later")); return;}
  if(d.copy!==undefined){copy(d.copy); return;}
  if(d.cat){cat=d.cat; render(); return;}
  if(d.size){const [id,i]=d.size.split(":"); pick[id].size=+i; render(); return;}
  if(d.add){const s=pick[d.add]||{size:0,text:""}; const ex=cart.find(l=>l.id===d.add&&l.size===s.size&&l.text===s.text);
    if(ex) ex.qty++; else cart.push({id:d.add,size:s.size,qty:1,text:s.text}); renderChrome();
    toast(L("נוסף לסל","Added to cart")); return;}
  if(d.q){readForm(); const [i,n]=d.q.split(":").map(Number); cart[i].qty+=n; if(cart[i].qty<=0) cart.splice(i,1); render(); return;}
  if(d.signin!==undefined){adminIn=true; render(); return;}
  if(d.signout!==undefined){adminIn=false; render(); return;}
  if(d.oo){openOrder=openOrder===d.oo?null:d.oo; render(); return;}
  if(d.of){orderFilter=d.of; render(); return;}
  if(d.ost){const [r,s]=d.ost.split(":"); ORDERS.find(o=>o.ref===r).st=s; render(); toast(L("עודכן","Updated")); return;}
  if(d.pay){const o=ORDERS.find(o=>o.ref===d.pay); o.paid={method:document.getElementById("pm-"+o.ref).value,amount:+document.getElementById("pa-"+o.ref).value||0,date:iso(today),by:L("את/ה","you")}; render(); toast(L("סומנה כשולמה","Marked as paid")); return;}
  if(d.unpay){ORDERS.find(o=>o.ref===d.unpay).paid=null; render(); return;}
  if(d.op){openProduct=openProduct===d.op?null:d.op; render(); return;}
  if(d.gm){const [i,n]=d.gm.split(":").map(Number); const j=i+n; [GAL[i],GAL[j]]=[GAL[j],GAL[i]]; render(); return;}
  if(d.gd){GAL.splice(+d.gd,1); render(); toast(L("נמחקה","Deleted")); return;}
  if(d.cdel){S.closedDates=S.closedDates.filter(x=>x!==d.cdel); render(); return;}
  if(d.cadd!==undefined){const v=document.getElementById("s-cadd").value; if(v&&!S.closedDates.includes(v)){S.closedDates.push(v); S.closedDates.sort();} render(); return;}
  if(el.tagName==="A"&&el.getAttribute("href")===location.hash&&location.hash.startsWith("#policies-")){scrollToSec(); }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="cancelForm"){toast(L("בקשת הביטול נשלחה","Cancellation request sent")); e.target.reset(); return;}
  if(e.target.id!=="orderForm") return;
  readForm(); errs={};
  const items=cart.filter(l=>prod(l.id).on);
  const lead=Math.max(S.leadDays,...items.map(l=>prod(l.id).lead)), minD=earliest(lead);
  if(!form.date) errs.date=L("נא לבחור תאריך","Choose a date");
  else if(form.date<minD) errs.date=L(`המועד הקרוב הוא ${fmtDate(minD)}`,`The earliest date is ${fmtDate(minD)}`);
  else if(isClosedDay(form.date)) errs.date=L("אנחנו סגורים בתאריך הזה. נא לבחור תאריך אחר.","We're closed that day. Choose another date.");
  if(!form.name.trim()) errs.name=L("נא למלא שם","Enter your name");
  if(form.phone.replace(/\D/g,"").length<9) errs.phone=L("נא למלא מספר טלפון תקין","Enter a valid phone number");
  if(form.f==="delivery"&&!form.addr.trim()) errs.addr=L("נא למלא כתובת למשלוח","Enter a delivery address");
  if(!form.terms) errs.terms=L("נא לאשר את התקנון","Please accept the terms");
  if(!items.length) errs.terms=L("אין מוצרים זמינים בסל","No available items in your cart");
  if(Object.keys(errs).length){render(); const f=document.querySelector('[aria-invalid="true"]'); if(f) f.focus(); return;}
  const ref="T-"+(nextRef++);
  ORDERS.unshift({ref,name:form.name.trim(),phone:form.phone.trim(),email:form.email.trim(),items:items.map(l=>({...l})),date:form.date,f:form.f,addr:form.addr.trim(),pay:form.pay,st:"new",paid:null,cnote:form.notes.trim(),inote:""});
  cart=[]; form={...form,date:"",notes:"",terms:false};
  location.hash="order-"+ref;
});
document.addEventListener("change",e=>{
  const el=e.target, d=el.dataset;
  if(el.name==="f"){readForm(); form.f=el.value; render(); return;}
  if(el.name==="pay"){form.pay=el.value; return;}
  if(el.id==="c-date"){form.date=el.value; if(el.value&&isClosedDay(el.value)){errs.date=L("אנחנו סגורים בתאריך הזה. נא לבחור תאריך אחר.","We're closed that day. Choose another date."); readForm(); render();} else if(errs.date){delete errs.date; readForm(); render();} return;}
  if(d.p){const [id,k]=d.p.split(":"), p=prod(id);
    if(k==="on") p.on=el.checked;
    else if(k.startsWith("name.")) p.name[k.slice(5)]=el.value;
    else if(k.startsWith("size")) p.sizes[+k.slice(4)].price=Math.max(0,+el.value||0);
    else if(k.startsWith("al.")){const a=k.slice(3); p.al=el.checked?[...new Set([...p.al,a])]:p.al.filter(x=>x!==a);}
    else if(k==="lead") p.lead=Math.max(1,+el.value||1);
    else p[k]=el.value;
    toast(L("נשמר","Saved")); if(k==="on"||k==="mode"||k==="cat") render(); return;}
  if(d.s){const [key,sub]=d.s.split(".");
    const val=el.type==="checkbox"?el.checked:el.type==="number"?Math.max(0,+el.value||0):el.value;
    if(sub) S[key][sub]=val; else S[key]=val; renderChrome(); toast(L("נשמר","Saved")); return;}
  if(d.g){const [i,k]=d.g.split(":"); GAL[+i][k]=el.value; toast(L("נשמר","Saved")); return;}
  if(d.inote){ORDERS.find(o=>o.ref===d.inote).inote=el.value; toast(L("נשמר","Saved")); return;}
});
document.addEventListener("input",e=>{
  const d=e.target.dataset;
  if(d.pptext){pick[d.pptext].text=e.target.value; const c=document.getElementById("pp-count"); if(c) c.textContent=`${e.target.value.length}/30`;}
});
function scrollToSec(){const rt=route(); if(rt.r==="policies"&&rt.sec){const s=document.getElementById("sec-"+rt.sec); if(s) s.scrollIntoView({block:"start"});} else window.scrollTo(0,0);}
window.addEventListener("hashchange",()=>{if(route().r!=="cart") errs={}; render(); scrollToSec();});
render(); scrollToSec();
</script>

</body>
