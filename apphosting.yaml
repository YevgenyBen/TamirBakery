# Firebase App Hosting settings for the tamir-bakery backend (europe-west4).
# Reference: https://firebase.google.com/docs/app-hosting/configure
# Secrets (e.g. RESEND_API_KEY) go in Cloud Secret Manager and are referenced
# here with `secret:`, never written as values. See PLAN.md "Tech stack and hosting".
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability:
      - BUILD
      - RUNTIME
  # Public reCAPTCHA site key for App Check (PLAN.md "App Check and order-form abuse").
  # Not a secret: it ships in the browser bundle. Each Firebase project has its own.
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6LeXSCsuAAAAADdtQ9vtPJFQECL4V5n4RpPynHfz
    availability:
      - BUILD
      - RUNTIME
